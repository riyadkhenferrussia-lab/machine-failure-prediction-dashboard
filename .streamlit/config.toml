# Streamlit configuration for the dashboard (optional; Streamlit falls back to its defaults without it).

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"

[server]
headless = true
maxUploadSize = 10          # MB; matches MAX_UPLOAD_BYTES in src/config.py
enableXsrfProtection = true

[browser]
gatherUsageStats = false
